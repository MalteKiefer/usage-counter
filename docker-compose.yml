name: usage-counter

services:
  app:
    build:
      context: .
    image: usage-counter:local
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      # Bound to the host loopback only. The API has no authentication yet.
      - "127.0.0.1:8080:3001"
    volumes:
      - oil-data:/data

volumes:
  oil-data:
