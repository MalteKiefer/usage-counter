name: usage-counter

services:
  app:
    image: ghcr.io/maltekiefer/usage-counter:${USAGE_COUNTER_VERSION:-1.1.0}
    build:
      context: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # Restore parses up to 25 MB of JSON, which needs several times that in memory.
    mem_limit: 1g
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
    ports:
      # Bound to the host loopback only. The API has no authentication yet.
      - "127.0.0.1:8080:3001"
    volumes:
      - oil-data:/data

volumes:
  oil-data:
