name: usage-counter

services:
  app:
    image: ghcr.io/maltekiefer/usage-counter:${USAGE_COUNTER_VERSION:-3.0.2}
    build:
      context: .
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    # Restore parses up to 25 MB of JSON, which needs several times that in memory.
    mem_limit: 1g
    environment:
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      BACKUP_LIMIT_MB: ${BACKUP_LIMIT_MB:-25}
      # Sign-in with Pocket-ID, see README. Uncomment the secret line when OIDC_ENABLED=true.
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      # OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    ports:
      # Bound to the host loopback only. Without OIDC the API has no authentication.
      - "127.0.0.1:8080:3001"
    volumes:
      - data:/data
    # Uncomment together with OIDC_CLIENT_SECRET_FILE, see README.
    # secrets:
    #   - oidc_client_secret

volumes:
  data:

# secrets:
#   oidc_client_secret:
#     file: ./secrets/oidc_client_secret
